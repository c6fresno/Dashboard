<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondeo Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0e27; color: #ffffff; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { margin-bottom: 40px; border-bottom: 2px solid #1a4d4d; padding-bottom: 20px; }
        h1 { font-size: 2.5em; color: #d4af37; margin-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #1a1f3a; border: 2px solid #1a4d4d; border-radius: 10px; padding: 25px; text-align: center; }
        .stat-label { font-size: 0.9em; color: #888; margin-bottom: 10px; }
        .stat-value { font-size: 2em; font-weight: bold; color: #d4af37; }
        .positive { color: #00d4aa; }
        .negative { color: #ff6b6b; }
        .charts-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 30px; margin-bottom: 40px; }
        .chart-box { background: #1a1f3a; border: 2px solid #1a4d4d; border-radius: 10px; padding: 20px; }
        .chart-title { color: #d4af37; margin-bottom: 20px; font-size: 1.3em; font-weight: bold; }
        .accounts-section { background: #1a1f3a; border: 2px solid #1a4d4d; border-radius: 10px; padding: 30px; }
        .section-title { color: #d4af37; font-size: 1.5em; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #00d4aa; font-weight: bold; }
        input, select { width: 100%; padding: 12px; background: #0a0e27; border: 2px solid #1a4d4d; color: #fff; border-radius: 5px; font-size: 1em; }
        input:focus, select:focus { outline: none; border-color: #d4af37; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        button { background: linear-gradient(135deg, #d4af37, #f0d860); color: #0a0e27; border: none; padding: 12px 30px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1em; }
        .accounts-table { width: 100%; margin-top: 30px; border-collapse: collapse; }
        .accounts-table th { background: #0a0e27; color: #d4af37; padding: 15px; text-align: left; border-bottom: 2px solid #1a4d4d; }
        .accounts-table td { padding: 12px 15px; border-bottom: 1px solid #1a4d4d; }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.9em; font-weight: bold; }
        .status-passed { background: rgba(0, 212, 170, 0.2); color: #00d4aa; }
        .status-suspended { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Fondeo Dashboard</h1>
            <p style="color: #888;">Controla tu inversión y ROI en tiempo real</p>
        </header>
        <div class="stats-grid" id="statsGrid"></div>
        <div class="charts-container">
            <div class="chart-box">
                <div class="chart-title">Estado de Cuentas</div>
                <div id="passRateChart"></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">Inversión vs Retiros</div>
                <div id="profitChart"></div>
            </div>
        </div>
        <div class="accounts-section">
            <h2 class="section-title">Agregar Nueva Cuenta</h2>
            <form id="accountForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Empresa de Fondeo</label>
                        <input type="text" id="company" placeholder="Ej: Topstep, Alpha..." required>
                    </div>
                    <div class="form-group">
                        <label>Inversión (€)</label>
                        <input type="number" id="invested" placeholder="100" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Retiros (€)</label>
                        <input type="number" id="withdrawn" placeholder="0" step="0.01" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="status" required>
                            <option value="active">Activa</option>
                            <option value="passed">Pasada</option>
                            <option value="suspended">Suspendida</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <button type="submit">Agregar Cuenta</button>
            </form>
            <h2 class="section-title" style="margin-top: 40px;">Mis Cuentas</h2>
            <table class="accounts-table" id="accountsTable">
                <thead>
                    <tr>
                        <th>Empresa</th>
                        <th>Inversión</th>
                        <th>Retiros</th>
                        <th>ROI</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script>
        const API_URL = '/api';
        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/stats`);
                const stats = await response.json();
                const statsHTML = `
                    <div class="stat-card"><div class="stat-label">Inversión Total</div><div class="stat-value">€${stats.total_invested.toFixed(2)}</div></div>
                    <div class="stat-card"><div class="stat-label">Retiros Total</div><div class="stat-value positive">€${stats.total_withdrawn.toFixed(2)}</div></div>
                    <div class="stat-card"><div class="stat-label">Beneficio Bruto</div><div class="stat-value ${stats.gross_profit >= 0 ? 'positive' : 'negative'}">€${stats.gross_profit.toFixed(2)}</div></div>
                    <div class="stat-card"><div class="stat-label">Impuestos 40%</div><div class="stat-value negative">€${stats.taxes.toFixed(2)}</div></div>
                    <div class="stat-card"><div class="stat-label">Beneficio Neto</div><div class="stat-value ${stats.net_profit >= 0 ? 'positive' : 'negative'}">€${stats.net_profit.toFixed(2)}</div></div>
                    <div class="stat-card"><div class="stat-label">ROI</div><div class="stat-value ${stats.roi >= 0 ? 'positive' : 'negative'}">%${stats.roi.toFixed(2)}</div></div>
                    <div class="stat-card"><div class="stat-label">Pass Rate</div><div class="stat-value">%${stats.pass_rate.toFixed(2)}</div></div>
                    <div class="stat-card"><div class="stat-label">Total Cuentas</div><div class="stat-value">${stats.total_accounts}</div></div>
                `;
                document.getElementById('statsGrid').innerHTML = statsHTML;
                const passRateData = [{values: [stats.total_passed, stats.total_suspended], labels: ['Pasadas', 'Suspendidas'], type: 'pie', marker: {colors: ['#00d4aa', '#ff6b6b']}, textinfo: 'label+percent'}];
                Plotly.newPlot('passRateChart', passRateData, {paper_bgcolor: 'rgba(26, 31, 58, 0)', plot_bgcolor: 'rgba(26, 31, 58, 0)', font: {color: '#ffffff'}});
                const profitData = [{x: ['Inversión', 'Retiros', 'Beneficio'], y: [stats.total_invested, stats.total_withdrawn, stats.gross_profit], type: 'bar', marker: {color: ['#d4af37', '#00d4aa', stats.gross_profit >= 0 ? '#00d4aa' : '#ff6b6b']}}];
                Plotly.newPlot('profitChart', profitData, {paper_bgcolor: 'rgba(26, 31, 58, 0)', plot_bgcolor: 'rgba(26, 31, 58, 0)', font: {color: '#ffffff'}, yaxis: {title: '€'}});
            } catch(e) { console.error(e); }
        }
        async function loadAccounts() {
            try {
                const response = await fetch(`${API_URL}/accounts`);
                const accounts = await response.json();
                const tbody = document.querySelector('.accounts-table tbody');
                tbody.innerHTML = '';
                accounts.forEach(account => {
                    const roi = ((account.withdrawn - account.invested) / account.invested * 100).toFixed(2);
                    const statusClass = account.status === 'passed' ? 'status-passed' : 'status-suspended';
                    const statusText = account.status === 'passed' ? 'Pasada' : account.status === 'suspended' ? 'Suspendida' : 'Activa';
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${account.company}</td>
                        <td>€${parseFloat(account.invested).toFixed(2)}</td>
                        <td>€${parseFloat(account.withdrawn).toFixed(2)}</td>
                        <td class="${roi >= 0 ? 'positive' : 'negative'}">%${roi}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>${account.date}</td>
                        <td><button class="btn-sm" onclick="deleteAccount(${account.id})">Eliminar</button></td>
                    `;
                    tbody.appendChild(row);
                });
            } catch(e) { console.error(e); }
        }
        document.getElementById('accountForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newAccount = {
                company: document.getElementById('company').value,
                invested: parseFloat(document.getElementById('invested').value),
                withdrawn: parseFloat(document.getElementById('withdrawn').value),
                status: document.getElementById('status').value,
                date: document.getElementById('date').value
            };
            await fetch(`${API_URL}/accounts`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(newAccount)});
            document.getElementById('accountForm').reset();
            document.getElementById('date').valueAsDate = new Date();
            loadAccounts();
            loadStats();
        });
        async function deleteAccount(id) {
            if (confirm('¿Eliminar esta cuenta?')) {
                await fetch(`${API_URL}/accounts/${id}`, {method: 'DELETE'});
                loadAccounts();
                loadStats();
            }
        }
        document.getElementById('date').valueAsDate = new Date();
        loadStats();
        loadAccounts();
        setInterval(() => { loadStats(); loadAccounts(); }, 5000);
    </script>
</body>
</html>
