<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="true">
<meta name="mobile-web-app-capable" content="true">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  width: 100%;
  height: 100%;
  font-family: 'Manrope', sans-serif;
  background: #000000;
  color: #ffffff;
  overflow-x: hidden;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  flex-wrap: wrap;
  gap: 20px;
}
header h1 {
  font-size: 28px;
  font-weight: 700;
}
header .controls {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  align-items: center;
}
.toggle-btn, .btn-primary, .btn-secondary {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s ease;
}
.toggle-btn {
  background: #333;
  color: #fff;
}
.toggle-btn.active {
  background: #D4A72C;
  color: #000;
}
.btn-primary {
  background: #D4A72C;
  color: #000;
}
.btn-primary:hover {
  background: #e5b83e;
  transform: translateY(-2px);
}
.btn-secondary {
  background: #2CC9B0;
  color: #000;
}
.btn-secondary:hover {
  background: #35dfc4;
}
.btn-danger {
  background: #EF4E6A;
  color: #fff;
}
.btn-danger:hover {
  background: #ff5f7a;
}
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}
.kpi-card {
  background: #111;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 20px;
  position: relative;
}
.kpi-card.highlight {
  border-color: #D4A72C;
  box-shadow: 0 0 20px rgba(212, 167, 44, 0.2);
}
.kpi-label {
  font-size: 12px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
}
.kpi-value {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 10px;
}
.kpi-card.dorado .kpi-value {
  color: #D4A72C;
}
.kpi-card.teal .kpi-value {
  color: #2CC9B0;
}
.kpi-card.rojo .kpi-value {
  color: #EF4E6A;
}
